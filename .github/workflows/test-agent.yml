name: Unit-test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code, so it gets a read-only token and no secrets.
  verify:
    name: Analyze changes and re-run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      needs_agent: ${{ steps.report.outputs.needs_agent }}
      head_by_agent: ${{ steps.report.outputs.head_by_agent }}
      ok: ${{ steps.report.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Analyze changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/skills/analyze-pr-changes/analyze_changes.py --base "origin/$BASE_REF"
      - name: Run all tests
        run: python3 .github/skills/run-tests/run_tests.py all || true
      - name: Build report
        id: report
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/scripts/test_agent_report.py --run-url "$RUN_URL" >> "$GITHUB_OUTPUT"
          cat .test-agent/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agent-report
          path: .test-agent/
          include-hidden-files: true
          retention-days: 14
      - name: Fail on failing tests or out-of-scope agent changes
        if: steps.report.outputs.ok != 'true'
        run: |
          echo "::error::Tests failed or the agent changed non-test files. See the PR comment for details."
          exit 1

  # Posts the report; never checks out or runs PR code.
  comment:
    name: Publish report on the PR
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.ok != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-report
          path: report
      - name: Create or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          id=$(gh api "$COMMENTS" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- unit-test-agent -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@report/comment.md > /dev/null
          else
            gh api "$COMMENTS" -F body=@report/comment.md > /dev/null
          fi

  # Asks the Copilot cloud agent for tests. Never re-requested for the agent's own pushes.
  request-tests:
    name: Request tests from the Copilot agent
    needs: verify
    if: >-
      ${{ !cancelled() && needs.verify.outputs.needs_agent == 'true' && needs.verify.outputs.head_by_agent == 'false'
      && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mention @copilot with the unit-test agent instructions
        env:
          # A user token is required: comments from the Actions bot do not start the Copilot agent.
          GH_TOKEN: ${{ secrets.COPILOT_TRIGGER_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::COPILOT_TRIGGER_TOKEN is not set, so the Copilot agent was not requested."
            exit 0
          fi
          body="<!-- unit-test-agent-request -->
          @copilot Use the **unit-test-agent** custom agent to create or update unit tests for the changes in this pull request.
          The base branch is \`origin/$BASE_REF\`. Start with the \`analyze-pr-changes\` skill. The **Unit-test agent** comment lists the changed lines that are not covered yet and any failing tests."
          gh api "$COMMENTS" -f body="$body" > /dev/null
